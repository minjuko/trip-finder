services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: tripfinder_dev
      POSTGRES_USER: tripfinder_dev
      POSTGRES_PASSWORD: tripfinder_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripfinder_dev -d tripfinder_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
