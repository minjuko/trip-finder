name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-for-deployment-0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          TOUR_API_E2E_FIXTURES: "true"

      - name: Production build
        run: npm run build
        env:
          TOUR_API_E2E_FIXTURES: "true"
          TOUR_API_SERVICE_KEY: fixture-only-not-a-real-key

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: tripfinder_test
          POSTGRES_USER: tripfinder_test
          POSTGRES_PASSWORD: tripfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripfinder_test -d tripfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tripfinder_test:tripfinder_test@127.0.0.1:5432/tripfinder_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-deployment-0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply reviewed migrations to empty PostgreSQL
        run: npm run db:migrate

      - name: Verify migration repeatability
        run: npm run db:migrate

      - name: PostgreSQL integration tests
        run: npm run test:db

      - name: Better Auth PostgreSQL integration tests
        run: npm run test:auth-db
